name: Core Wealth Hub Assurance Suite

on:
  workflow_dispatch:
    inputs:
      requirements_url:
        description: >
          Optional: URL to a requirements doc (web page, Jira/Confluence/Linear issue, etc.)
          not yet committed to this repo. When set, the run previews the use-cases/ACs kane-cli
          would extract from it (logged + added to the job summary) — it does NOT design or run
          new tests automatically; that still needs a human review/approve step done locally.
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - '.testmuai/tests/**'
      - '.github/workflows/assurance.yml'

jobs:
  assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install kane-cli
        run: npm install -g @testmuai/kane-cli

      - name: Authenticate kane-cli
        run: kane-cli login --username "${{ secrets.KANE_CLI_USERNAME }}" --access-key "${{ secrets.KANE_CLI_ACCESS_KEY }}"

      - name: "Preview: extract use-cases from a requirements doc URL (optional input)"
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.requirements_url != '' }}
        run: |
          set -o pipefail
          {
            echo "## Requirements preview — ${{ github.event.inputs.requirements_url }}"
            echo
            echo "This is a preview only: the doc below was ingested and extracted into a"
            echo "throwaway store for this run so you can see what kane-cli would propose."
            echo "Nothing here was designed into tests or added to the suite — approving"
            echo "use-cases and designing tests still needs a human running the assurance"
            echo "flow locally (see README.md)."
            echo
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          kane-cli context ingest "${{ github.event.inputs.requirements_url }}" --mode agent 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### Proposed use-cases (unreviewed)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          kane-cli context list --json --inferred 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Run the assurance test suite
        id: testrun
        run: |
          set -o pipefail
          kane-cli testrun run \
            --headless \
            --parallel 1 \
            --on-failure continue \
            --name "CI run #${{ github.run_number }} (${{ github.sha }})" \
            | tee testrun-output.ndjson

      - name: Present assurance results (use-cases, ACs, tests, pass/fail)
        if: always()
        run: node scripts/render-assurance-report.js testrun-output.ndjson

      - name: Build assurance proof dashboard (HTML)
        if: always()
        run: node scripts/render-assurance-dashboard.js testrun-output.ndjson

      - name: Upload assurance dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assurance-dashboard-${{ github.run_number }}
          path: assurance-report.html
          if-no-files-found: warn
          retention-days: 90

      - name: Upload evidence packs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-packs-${{ github.run_number }}
          path: .testmuai/evidence/*.evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Upload raw run output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testrun-output-${{ github.run_number }}
          path: testrun-output.ndjson
          if-no-files-found: warn
          retention-days: 90
