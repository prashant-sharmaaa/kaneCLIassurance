name: Core Wealth Hub Assurance Suite

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.testmuai/tests/**'
      - '.github/workflows/assurance.yml'
  schedule:
    # Weekly regression, Monday 03:00 UTC
    - cron: '0 3 * * 1'

jobs:
  assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install kane-cli
        run: npm install -g @testmuai/kane-cli

      - name: Authenticate kane-cli
        run: kane-cli login --username "${{ secrets.KANE_CLI_USERNAME }}" --access-key "${{ secrets.KANE_CLI_ACCESS_KEY }}"

      - name: Run the assurance test suite
        id: testrun
        run: |
          kane-cli testrun run \
            --headless \
            --parallel 1 \
            --on-failure continue \
            --name "CI run #${{ github.run_number }} (${{ github.sha }})"

      - name: Generate coverage / assurance report
        if: always()
        run: |
          {
            echo "## Coverage — proof pack"
            kane-cli cover
            echo
            echo "## Coverage — designed x proven, per use case"
            kane-cli cover gaps
          } | tee assurance-coverage-report.txt

      - name: Upload evidence packs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-packs-${{ github.run_number }}
          path: .testmuai/evidence/*.evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.run_number }}
          path: assurance-coverage-report.txt
          retention-days: 90
